# Optional live IdP demo — does not gate the product build.
# Use workflow_dispatch / schedule. For your own IdP, fork and set issuer + suppressions/baseline.
name: AuthGuard live demo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  live-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run AuthGuard (Microsoft common — illustrative only)
        id: ag
        uses: ./
        with:
          issuer: https://login.microsoftonline.com/common/v2.0
          profile: standard
          idp: enterprise
          # Demo IdPs advertise legacy surface; critical-only keeps the job informative.
          fail-on: critical
          policy-file: .authguard.yml
          sarif-file: authguard.sarif
          json-file: authguard.json

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: authguard.sarif
        continue-on-error: true

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authguard-live-report
          path: |
            authguard.json
            authguard.sarif
